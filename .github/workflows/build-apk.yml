name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies & build web assets
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/HealthLevel1000.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HealthLevel1000-APK
          path: release-apk/HealthLevel1000.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Health Level 1000 — Android APK"
          body: |
            ### 📱 Health Level 1000 Android APK (Latest Build)
            - **Direct APK Download:** [HealthLevel1000.apk](https://github.com/${{ github.repository }}/releases/download/latest/HealthLevel1000.apk)
            - **Commit:** ${{ github.sha }}
            - **100% Free:** Built automatically in the cloud with GitHub Actions.
          files: release-apk/HealthLevel1000.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
