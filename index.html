<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Gamified bodyweight fitness: 1,000 progressive levels, 4 goal tracks, integrated work/rest timers, and a Gulbarga vegetarian fuel plan.">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HL1000">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<title>Health Level 1000 — Gamified Fitness Ecosystem</title>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0f1526; --card:#141b2e; --card2:#1a2238;
  --line:#243049; --txt:#e8ecf7; --dim:#8f9bbd; --dim2:#5f6b8a;
  --ok:#2fd6a0; --warn:#ffc857; --bad:#ff5f6d; --acc:#3d8bff;
  --trk:#a06bff; --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
a{color:var(--acc)}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(96px + var(--safe-b))}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0a0e1a 60%,#0a0e1ae6);
  border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.hrow{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.5px;font-size:15px;flex:1}
.logo span{color:var(--trk)}
.xp{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.xp b{color:var(--txt)}

/* ---------- rank rail ---------- */
.rail{height:6px;background:var(--card2);position:relative;overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--trk),#fff);transition:width .5s}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0d1220ee;
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe-b));display:flex}
nav button{flex:1;padding:6px 2px;border-radius:12px;color:var(--dim2);
  font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.18s}
nav button b{font-size:17px;font-weight:400;line-height:1}
nav button.on{color:var(--trk);background:#ffffff0d}

/* ---------- cards ---------- */
.card{background:linear-gradient(160deg,var(--card),#111729);border:1px solid var(--line);
  border-radius:20px;padding:16px;margin:12px 0}
.card.tight{padding:13px}
h1{font-size:22px;margin:18px 2px 2px;letter-spacing:-.4px}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.2px}
h3{font-size:14px;margin:0 0 8px}
p{margin:6px 0;color:var(--dim);font-size:13.5px;line-height:1.55}
.mut{color:var(--dim2);font-size:12px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.row{display:flex;gap:10px;align-items:center}
.row.w{justify-content:space-between}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* ---------- level orb ---------- */
.orb{position:relative;width:168px;height:168px;margin:6px auto 10px}
.orb svg{transform:rotate(-90deg)}
.orb .mid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.orb .lvl{font-size:11px;letter-spacing:2px;color:var(--dim)}
.orb .num{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;
  background:linear-gradient(180deg,#fff,var(--trk));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.orb .of{font-size:11px;color:var(--dim2);margin-top:3px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:16px;font-weight:700;font-size:15px;
  background:linear-gradient(135deg,var(--trk),#6a4bd8);color:#fff;
  box-shadow:0 8px 24px -10px var(--trk);transition:.15s}
.btn:active{transform:scale(.975)}
.btn.sec{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--txt);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--dim)}
.btn.sm{padding:10px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.good{background:linear-gradient(135deg,#22b98a,#128a63);box-shadow:0 8px 24px -10px #22b98a}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card2);
  border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--dim)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--trk),#6a4bd8)}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.3px;background:#ffffff10;
  border:1px solid var(--line);color:var(--dim)}
.pill.t{background:color-mix(in srgb,var(--trk) 18%,transparent);border-color:transparent;color:#fff}
.pill.ok{background:#2fd6a022;color:var(--ok);border-color:transparent}
.pill.w{background:#ffc85722;color:var(--warn);border-color:transparent}

/* ---------- exercise row ---------- */
.ex{border:1px solid var(--line);border-radius:16px;background:var(--card2);padding:12px;margin:10px 0}
.ex.done{border-color:#2fd6a055;background:#2fd6a00f}
.ex.cur{border-color:var(--trk);box-shadow:0 0 0 1px var(--trk) inset}
.ex .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.ex .cue{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.reps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.reps b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700}
.reps b.on{background:var(--trk);border-color:transparent;color:#fff}
.reps b.hit{background:#2fd6a026;border-color:#2fd6a055;color:var(--ok)}

/* ---------- timer ---------- */
.timer{text-align:center;padding:8px 0 4px}
.timer .t{font-size:78px;font-weight:800;letter-spacing:-4px;line-height:1;
  font-variant-numeric:tabular-nums}
.timer .lab{font-size:12px;letter-spacing:3px;color:var(--dim);margin-top:6px}
.timer.work .t{color:var(--ok);text-shadow:0 0 40px #2fd6a055}
.timer.rest .t{color:var(--warn);text-shadow:0 0 40px #ffc85744}
.ring{width:236px;height:236px;margin:0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center}

/* ---------- level cards ---------- */
.lv{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;
  border:1px solid var(--line);background:var(--card2);margin:8px 0}
.lv.lock{opacity:.42}
.lv.cur{border-color:var(--trk);background:color-mix(in srgb,var(--trk) 12%,var(--card2))}
.lv .n{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:var(--card);border:1px solid var(--line)}
.lv.cur .n{background:var(--trk);border-color:transparent;color:#fff}
.lv .t1{font-weight:700;font-size:13.5px}
.lv .t2{font-size:11.5px;color:var(--dim);margin-top:2px}
.lv .st{margin-left:auto;text-align:right;flex:none}

/* ---------- bar ---------- */
.bar{height:7px;border-radius:99px;background:var(--card);overflow:hidden;margin:7px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--trk),#fff);
  border-radius:99px;transition:width .4s}

/* ---------- log ---------- */
.logd{border-bottom:1px solid var(--line);padding:9px 0;display:flex;gap:10px;font-size:12.5px}
.logd b{font-variant-numeric:tabular-nums;min-width:34px}

/* ---------- diet ---------- */
.meal{border:1px solid var(--line);border-radius:16px;background:var(--card2);padding:13px;margin:10px 0}
.meal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.meal .mt{font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--trk)}
.meal ul{margin:6px 0 0;padding-left:17px}
.meal li{font-size:13px;color:var(--txt);line-height:1.6;margin:2px 0}
.note{border-left:3px solid var(--warn);padding:8px 0 8px 11px;margin:10px 0;
  background:#ffc8570d;border-radius:0 10px 10px 0;font-size:12.5px;color:var(--dim);line-height:1.55}
.ok-note{border-left-color:var(--ok);background:#2fd6a00d}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim2);font-size:10.5px;letter-spacing:.7px;font-weight:700}
td b{color:var(--txt)}

/* ---------- confetti ---------- */
#conf{position:fixed;inset:0;pointer-events:none;z-index:99}
#conf i{position:absolute;width:8px;height:14px;border-radius:2px;animation:fl 1.5s ease-in forwards}
@keyframes fl{to{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:#04060cd9;display:grid;place-items:center;padding:18px}
.modal .in{max-width:460px;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:20px;max-height:88vh;overflow:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:360px){.orb{width:140px;height:140px}.orb .num{font-size:38px}.timer .t{font-size:64px}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">HEALTH <span>LEVEL 1000</span></div>
    <div class="xp" id="xpLbl">LV <b>1</b> · <b>0</b> XP</div>
  </div>
  <div class="rail"><i id="rail" style="width:0%"></i></div>
</header>

<div class="wrap" id="view"></div>

<nav>
  <button data-v="dash" class="on"><b>◉</b>Dash</button>
  <button data-v="work"><b>▶</b>Train</button>
  <button data-v="levels"><b>▤</b>Levels</button>
  <button data-v="diet"><b>◍</b>Fuel</button>
  <button data-v="me"><b>☰</b>You</button>
</nav>

<div id="conf"></div>

<script>
"use strict";
/* ==========================================================================
   HEALTH LEVEL 1000 — single-file gamified fitness engine
   Bodyweight-only. 1000-level progression. 4 goals. No network required.
   Data below is a GENERATOR + curation, so all 1000 levels are real, not stubs.
   ========================================================================== */

/* ---------- tiny helpers ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.prototype.slice.call((r||document).querySelectorAll(s));
const clamp=(v,a,b)=> v<a?a:v>b?b:v;
const nf = n => n.toLocaleString('en-IN');
const pad2 = n => (n<10?'0':'')+n;
const mmss = s => pad2(Math.floor(s/60))+':'+pad2(s%60);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- persistence ---------- */
const KEY='hl1000.v1';
const blank={ level:1, xp:0, totalReps:0, totalWorkoutSec:0, workoutsDone:0, streak:0,
  lastDone:null, bestStreak:0, track:'', history:{}, repsToday:0, repsDay:'', bw:'', height:'',
  onboarded:false };
let S = load();
function load(){
  try{ const r=JSON.parse(localStorage.getItem(KEY)); return Object.assign({},blank,r||{}); }
  catch(e){ return Object.assign({},blank); }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ==========================================================================
   1. GOAL TRACKS
   ========================================================================== */
const TRACKS={
  fat:    {key:'fat',    name:'Fat Loss',        short:'FAT',  icon:'🔥', color:'#ff6b3d',
           goal:'Reduce body fat, protect muscle',          hue:14,
           dial:'Calorie deficit · high rep volume · short rests · HIIT density',
           fuel:'Deficit, high fibre, high volume, low oil. Protein kept high so muscle survives the cut.'},
  muscle: {key:'muscle', name:'Muscle Gain',     short:'MUSC', icon:'💪', color:'#3d8bff',
           goal:'Add lean mass with progressive overload',  hue:210,
           dial:'Small surplus · long tension · compound patterns · 60–90s rest',
           fuel:'Modest surplus, extra rice/ragi/jowar, protein at every meal, oil measured not poured.'},
  recomp: {key:'recomp', name:'Recomposition',   short:'RCMP', icon:'⚖️', color:'#2fd6a0',
           goal:'Lose fat and gain muscle at once',          hue:158,
           dial:'Tight volume · high protein · 30–45s rest · technique over load',
           fuel:'Balanced plate. Every meal carries protein. Veg first, carbs second, ghee/oil smallest.'},
  fit:    {key:'fit',    name:'Fitness',         short:'FIT',  icon:'🫀', color:'#a06bff',
           goal:'Engine, strength endurance, real-world carrying', hue:268,
           dial:'Intervals · aerobic base · core and carry work · low skill ceiling',
           fuel:'Carb-timed around training. More rice on training days, less on rest days.'}
};
const TRACK_ORDER=['fat','muscle','recomp','fit'];
const PHASES=['Foundation','Build','Intensity','Volume','Integrate'];
const PHASE_ROLE=[
  'Learn the movement. Form over everything.',
  'Add reps. Progression you can feel.',
  'Short rest, higher heart rate, real effort.',
  'More sets. Metabolic cost goes up.',
  'Full circuit. Fatigue is the point.'
];

/* ==========================================================================
   2. EXERCISE LIBRARY  (bodyweight only, but architected for equipment later)
   --------------------------------------------------------------------------
   Every entry carries: pattern + gear + a `cue`. The prescription engine reads
   `pattern` only. To add equipment later you add one entry with
   gear:'dumbbell' and the SAME pattern — timing/rep math is unchanged.
   ========================================================================== */
const EX={
  march:        {name:'March In Place',      pat:'tmpl',  gear:'none', side:false, cue:'Stand tall, soft knees, lift each knee to hip height. No jumping, no breath holding.', v:'march in place exercise'},
  wallPushup:   {name:'Wall Push-ups',       pat:'calis', gear:'none', side:false, cue:'Hands on wall at chest height, body in one line. Elbows 45°. Stop 2 reps shy of failure.', v:'wall push up proper form'},
  pushup:       {name:'Push-ups',            pat:'calis', gear:'none', side:false, cue:'Rigid plank line, chest to floor. Elbows 45°, not flared. Full lockout at the top.', v:'push up proper form'},
  pikepushup:   {name:'Pike Push-ups',       pat:'calis', gear:'none', side:false, cue:'Hips high, head toward the floor between the hands. Lower yourself slowly, count 2 seconds down.', v:'pike push up'},
  squat:        {name:'Bodyweight Squats',   pat:'tmpl',  gear:'none', side:false, cue:'Feet shoulder width. Sit back and down, knees tracking over toes, chest proud. Slow 3s down.', v:'bodyweight squat proper form'},
  lissajous:    {name:'Squats (Slow Tempo)', pat:'tmpl',  gear:'none', side:false, cue:'3 seconds down, 1 second pause, 1 second up. Slow the descent, not the effort.', v:'tempo squat'},
  lunge:        {name:'Reverse Lunges',      pat:'core',  gear:'none', side:true,  cue:'Step back, drop the back knee, drive through the front heel. Count per leg.', v:'reverse lunge proper form'},
  skater:       {name:'Skater Jumps',        pat:'core',  gear:'none', side:false, cue:'Bound side to side, stick the landing 1 second before the next jump. Quiet feet.', v:'skater jumps exercise'},
  situp:        {name:'Sit-ups',             pat:'core',  gear:'none', side:false, cue:'Curl the spine segment by segment. Do not yank the neck up.', v:'sit up proper form'},
  flutter:      {name:'Flutter Kicks',       pat:'core',  gear:'none', side:false, cue:'Lie flat, legs 20cm off the floor, fast small kicks. Lower back stays pressed down.', v:'flutter kick exercise'},
  deadbug:      {name:'Dead Bug',            pat:'core',  gear:'none', side:false, cue:'Lower back glued to the floor. Opposite arm and leg reach, breathe out on the reach.', v:'dead bug exercise'},
  bicepcurl:    {name:'Standing Bicep Curls',pat:'core',  gear:'none', side:false, cue:'Elbows pinned to the ribs, curl to the shoulder, lower fully. No swinging.', v:'bicep curl no weights'},
  calfraise:    {name:'Calf Raises',         pat:'core',  gear:'none', side:false, cue:'Up on your toes, pause at the top, down slow. Do not bounce.', v:'calf raise exercise'},
  tricepdip:    {name:'Bench Dips',          pat:'core',  gear:'bench', side:false, cue:'Hands behind you on a chair, hips close to the floor, elbows straight back.', v:'bench tricep dip'},
  glutebridge:  {name:'Glute Bridges',       pat:'tmpl',  gear:'none', side:false, cue:'Heels down, drive hips to the ceiling, squeeze 1 second at the top. Do not arch.', v:'glute bridge proper form'},
  highknees:    {name:'High Knees',          pat:'tmpl',  gear:'none', side:false, cue:'Knee to hip height, tall posture, quick ground contact. Count in seconds.', v:'high knees exercise'},
  jumpingjack:  {name:'Jumping Jacks',       pat:'tmpl',  gear:'none', side:false, cue:'Light on the feet, full arm overhead. Soft knees on landing.', v:'jumping jack proper form'},
  burpee:       {name:'Burpees',             pat:'power', gear:'none', side:false, cue:'Chest to floor, jump or step up, jump for height, land soft. Walk it if you must.', v:'burpee proper form'},
  mountaincl:   {name:'Mountain Climbers',   pat:'tmpl',  gear:'none', side:false, cue:'Hips steady and high, drive the knees fast. Do not bounce the shoulders.', v:'mountain climber exercise'},
  pike:         {name:'Pike Walk-Out',        pat:'power', gear:'none', side:false, cue:'Hips high, walk the hands out, walk back. Walk, do not jump, if the wrists complain.', v:'walk out exercise'},
  plank:        {name:'Plank',               pat:'static',gear:'none', side:false, cue:'Forearms and toes, body one line, glutes squeezed, breathe steadily.', v:'plank proper form'},
  sideplank:    {name:'Side Plank',          pat:'static',gear:'none', side:true,  cue:'Stack the feet, lift the hips, look forward. Count per side.', v:'side plank'},
  birddog:      {name:'Bird Dog',            pat:'static',gear:'none', side:true,  cue:'All fours, extend opposite arm and leg until the body is one line. Count per side.', v:'bird dog exercise'},
  bearplank:    {name:'Bear Plank',          pat:'static',gear:'none', side:false, cue:'Knees 2cm off the floor, back flat, hold. The whole core screams quietly.', v:'bear plank hold'},
  bearcrawl:    {name:'Bear Crawl',          pat:'calis', gear:'none', side:true,  cue:'Opposite hand and foot, hips low, move forward and back. Count per length.', v:'bear crawl'},
  wallsit:      {name:'Wall Sit',            pat:'iso',  gear:'wall', side:false, cue:'Back flat to the wall, knees at 90°, hold without holding your breath.', v:'wall sit hold'},
  superman:     {name:'Superman Hold',       pat:'iso',  gear:'none', side:true,  cue:'Lift arms and legs, squeeze the glutes, no neck extension. Count per side.', v:'superman exercise'},
  handstand:    {name:'Wall Handstand Hold', pat:'iso',  gear:'wall', side:false, cue:'Kick up to the wall, hands 15cm apart, push the floor away. Bend-knee kick-ups are fine.', v:'wall handstand hold'},
  burpeePike:   {name:'Pike Push-up',         pat:'power', gear:'none', side:false, cue:'Explosive lockout. Land soft, do not collapse the lower back.', v:'explosive pike push up'}
};

/* pattern -> prescription ranges. `repStep/workStep/restStep` scale per ROUND.
   mode: 'reps' counts repetitions | 'hold' counts seconds per side          */
const RANGE={
  calis:{mode:'reps', base:8,  step:1,  max:30, workBase:36, workStep:2, restBase:60, restStep:4, label:'reps'},
  tmpl: {mode:'reps', base:12, step:2,  max:40, workBase:32, workStep:2, restBase:45, restStep:3, label:'reps'},
  core: {mode:'reps', base:10, step:2,  max:40, workBase:30, workStep:2, restBase:40, restStep:3, label:'reps'},
  power:{mode:'reps', base:6,  step:1,  max:20, workBase:24, workStep:2, restBase:75, restStep:5, label:'reps'},
  iso:  {mode:'hold', base:20, step:3,  max:120,restBase:40,  restStep:3, label:'sec'},
  static:{mode:'hold',base:30, step:5,  max:150,restBase:45,  restStep:3, label:'sec'}
};
const RANGE_TRACK_MULT={fat:0.8, muscle:1.15, recomp:0.75, fit:0.9};

/* slot tables: [exerciseId, rangeKey] per track+phase. Neighbouring levels
   always draw from a different phase table, so no two levels repeat.        */
const SLOTS={
  fat:{0:[['squat','tmpl'],['glutebridge','tmpl'],['plank','static'],['birddog','static'],['bicepcurl','core']],
       1:[['lunge','core'],['highknees','tmpl'],['superman','iso'],['situp','core'],['sideplank','static']],
       2:[['burpee','power'],['mountaincl','tmpl'],['jumpingjack','tmpl'],['flutter','core'],['pike','power']],
       3:[['skater','core'],['bearcrawl','calis'],['deadbug','core'],['lissajous','tmpl'],['glutebridge','tmpl']],
       4:[['skater','core'],['flutter','core'],['jumpingjack','tmpl'],['lunge','core'],['bearplank','static']]},
  muscle:{0:[['wallPushup','calis'],['squat','tmpl'],['tricepdip','core'],['glutebridge','tmpl'],['plank','static']],
       1:[['pushup','calis'],['lunge','core'],['bicepcurl','core'],['sideplank','static'],['calfraise','core']],

/* ==========================================================================
   3. THE 1000-LEVEL ENGINE
   ========================================================================== */
const RANK_LADDER=[
 {min:1,t:'Initiate'},{min:5,t:'Mover'},{min:10,t:'Trained'},{min:20,t:'Ascender'},
 {min:35,t:'Grinder'},{min:50,t:'Gunner'},{min:70,t:'Behemoth'},{min:90,t:'Colossus'},
 {min:120,t:'Juggernaut'},{min:200,t:'Monolith'},{min:300,t:'Titan'},{min:400,t:'Valkyrie'},
 {min:500,t:'Sentinel'},{min:600,t:'Paragon'},{min:700,t:'Oracle'},{min:800,t:'Celestial'},
 {min:900,t:'Mythic'},{min:1000,t:'Ascended'}];
const XP=[10,14,18,24,32,42,55,72,95,125,165,215,280,360,465,600,775,1000,1295,1680];

const LEVELS=[];
(function build(){
  let floorSec=0, lastSig='';
  for(let n=1;n<=1000;n++){
    const tier=Math.floor((n-1)/4), phase=tier%5, round=Math.floor(tier/5)+1;
    const tr=TRACK_ORDER[(n-1)%4], prog=n/1000;
    const lv={n, track:tr, phase, round, phaseName:PHASES[phase], role:PHASE_ROLE[phase]};
    if(AUTHORED[n]){
      lv.ex=AUTHORED[n].ex.map(function(a){
        const R=RANGE[a[1]], isHold=R.mode==='hold';
        return {id:a[0],range:a[1],sets:a[2],reps:isHold?0:a[3],hold:isHold?a[4]:0,
          mode:R.mode, work:isHold?a[4]:clamp(a[3]*3+6,10,90), rest:45};
      });
    } else {
      /* rotate the slot window by goal so two levels sharing a phase never
         draw the same starting pair (L6/L7 and L8/L9 collided without this) */
      const tbl=SLOTS[tr][phase], off=((round-1)+TRACK_ORDER.indexOf(tr))%tbl.length;
      const g=Math.pow(prog,0.35);
      const count=clamp(2+Math.floor(g*4),2,5);
      const sets=clamp(2+Math.floor(g*4.5),2,5);
      const mult=RANGE_TRACK_MULT[tr], chosen=[];
      for(let i=0;i<count;i++) chosen.push(tbl[(off+i)%tbl.length]);
      /* two different goals can share an identical phase table, which made a
         few pairs (L143/144) land on the same movement list. Nudge the window. */
      const sig=chosen.map(function(c){return c[0];}).sort().join(',');
      if(sig===lastSig) for(let i=0;i<count;i++) chosen[i]=tbl[(off+1+i)%tbl.length];
      lastSig=chosen.map(function(c){return c[0];}).sort().join(',');
      lv.ex=chosen.map(function(pair){
        const R=RANGE[pair[1]], isHold=R.mode==='hold';
        const amount=clamp(Math.round(R.base*(0.7+0.8*prog)), isHold?8:4, isHold?60:R.max);
        const reps=isHold?0:amount, hold=isHold?amount:0;
        return {id:pair[0],range:pair[1],sets,reps,hold,mode:R.mode,
          work:isHold?amount:clamp(Math.round(reps*3+6),10,45),
          rest:clamp(Math.round((R.restBase+R.restStep*prog*10)*mult/5)*5,30,90)};
      });
    }
    /* single authority for session length: non-decreasing, hard 45-min ceiling */
    const CAP=2700;
    const raw=lv.ex.reduce((t,e)=>t+(e.work+e.rest)*e.sets,0);
    const target=Math.min(CAP, Math.max(floorSec, Math.round(raw/5)*5));
    if(target>raw){ const f=target/raw;
      lv.ex.forEach(function(e){ e.work=Math.max(8,Math.round(e.work*f));
        e.rest=Math.max(20,Math.round(e.rest*f/5)*5); }); }
    floorSec=target;
    lv.title=TRACKS[tr].name+' · '+lv.phaseName+' '+round;
    lv.name =AUTHORED[n]?AUTHORED[n].name:lv.ex.length+' moves · '+lv.phaseName+' '+round;
    lv.note=AUTHORED[n]?AUTHORED[n].note:lv.role+' Track: '+TRACKS[tr].dial+'.';
    lv.sets=lv.ex[0].sets;
    lv.totalSec=target;
    lv.reps=lv.ex.reduce((t,e)=>t+(e.mode==='reps'?e.reps*e.sets:0),0);
    lv.xp=Math.round(10+(n-1)*0.9+prog*prog*1200);
    LEVELS.push(lv);
  }
})();

function rankOf(n){
  let r=RANK_LADDER[0];
  for(let i=0;i<RANK_LADDER.length;i++) if(n>=RANK_LADDER[i].min) r=RANK_LADDER[i];
  const i=RANK_LADDER.indexOf(r), next=RANK_LADDER[i+1];
  const span=next?next.min-r.min:1, prog=next?clamp((n-r.min)/span,0,1):1;
  return {name:r.t, index:i, next:next?next.t:null, nextAt:next?next.min:1000, prog:prog, tier:i+1};
}
function totalXPUpTo(n){ let t=0; for(let i=1;i<n;i++) t+=LEVELS[i-1].xp; return t; }
function levelOf(xp){ let lv=1; while(lv<1000 && xp>=LEVELS[lv-1].xp){ xp-=LEVELS[lv-1].xp; lv++; } return lv; }
function openLevels(){ return S.level; }              /* levels 1..S.level are unlocked */
function isUnlocked(n){ return n<=S.level; }
function activeTrack(){ return TRACKS[S.track] ? S.track : 'recomp'; }
function currentLevel(){ return LEVELS[clamp(S.level,1,1000)-1]; }
function nextLevel(){ return LEVELS[S.level] || null; }
function unlockedByTrack(){ const c={fat:0,muscle:0,recomp:0,fit:0}; for(let n=1;n<=S.level;n++){ c[TRACK_ORDER[(n-1)%4]]++; } return c; }

   ========================================================================== */
function refreshDay(){
  const t=new Date().toISOString().slice(0,10);
  if(S.repsDay!==t){ S.repsDay=t; S.repsToday=0; save(); }
}
function doneToday(){ return S.lastDone===new Date().toISOString().slice(0,10); }
function streakTxt(){ return S.streak?S.streak+' day'+(S.streak>1?'s':''):'—'; }

/* ==========================================================================
   5. WORKOUT SESSION  (reps + integrated work timer + integrated rest timer)
   ========================================================================== */
const W={ level:null, exIdx:0, setIdx:1, repsDone:0, tapped:{}, timer:null, phase:'idle',
          endAt:0, total:0, left:0, restLen:0, started:false, sessionSec:0, paused:false };
let AC=null;
function beep(kind){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime;
    if(kind==='end'){ o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(1320,t+.12); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.55); o.start(t); o.stop(t+.6); }
    else if(kind==='go'){ o.type='square'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(880,t+.1); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.25); o.start(t); o.stop(t+.28); }
    else { o.type='sine'; o.frequency.setValueAtTime(660,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.12); o.start(t); o.stop(t+.14); }
  }catch(e){}
}
function buzz(p){ if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }

function startLevel(n){
  if(!isUnlocked(n)) return;
  W.level=LEVELS[n-1]; W.exIdx=0; W.setIdx=1; W.repsDone=0; W.tapped={};
  W.sessionSec=0; W.total=0; W.started=false; W.paused=false; W.phase='idle';
  VIEW='work'; render();
}
function exNow(){ return W.level? W.level.ex[W.exIdx] : null; }

function phaseWord(){ return W.phase==='work'?'WORK':W.phase==='rest'?'REST':W.phase==='between'?'NEXT UP':W.phase==='done'?'DONE':'READY'; }
function durNow(){
  if(W.phase==='work'){ const e=exNow(); return e.work; }
  if(W.phase==='rest'){ return W.restLen||0; }
  return 0;
}
function runTimer(sec,phase){
  W.phase=phase; W.total=sec; W.endAt=Date.now()+sec*1000; W.paused=false;
  if(W.timer) clearInterval(W.timer);
  W.timer=setInterval(tick,250);
  tick();
}
function pauseTimer(){
  if(W.phase==='work'||W.phase==='rest'){
    if(W.paused){ W.endAt=Date.now()+W.left*1000; W.paused=false; W.timer=setInterval(tick,250); }
    else { W.left=Math.max(0,Math.round((W.endAt-Date.now())/1000)); W.paused=true; clearInterval(W.timer); }
    paintTimer();
  }
}
function stopTimer(){ if(W.timer) clearInterval(W.timer); W.timer=null; }

function beginWork(){
  const e=exNow(); beep('go'); buzz(60);
  if(e.mode==='reps' && !W.started){ W.started=true; }
  runTimer(e.work,'work');
}
function beginRest(){
  const e=exNow();
  W.restLen=e.rest;
  beep('rest'); buzz([40,60,40]);
  runTimer(e.rest,'rest');
}
function tick(){
  if(W.phase!=='work'&&W.phase!=='rest') return;
  if(W.paused) return;
  const left=Math.max(0,Math.round((W.endAt-Date.now())/1000));
  if(left!==W.left){
    if(left<=3&&left>0){ beep('tick'); buzz(20); }
    W.left=left; W.sessionSec++; paintTimer();
  }
  if(left<=0){ if(W.phase==='work') endWork(); else { stopTimer(); beginWork(); } }
}
function endWork(){
  stopTimer();
  const e=exNow();
  if(W.setIdx>=e.sets){ W.setIdx=1; W.exIdx++; if(W.exIdx>=W.level.ex.length){ W.phase='done'; W.started=true; buzz([80,60,80,60,120]); beep('end'); render(); return; } }
  else { W.setIdx++; }
  beginRest();
}
function next(){
  if(W.phase==='rest'){ stopTimer(); beginWork(); render(); return; }
}
function skipPhase(){
  if(W.phase==='work'){ endWork(); render(); return; }
  if(W.phase==='rest'){ stopTimer(); beginWork(); render(); return; }
}
function manualRep(n){
  if(!W.started||W.phase!=='work') return;
  const e=exNow(); if(!e||e.mode!=='reps') return;
  W.tapped[W.exIdx]=(W.tapped[W.exIdx]||0)+n;
  W.repsDone=Math.min(e.reps, W.tapped[W.exIdx]);
  S.repsToday+=n; S.totalReps+=n; refreshDay(); save(); paintReps();
}
/* Single authority for banking. Whatever the user tapped is already in
   S.totalReps; credit only the shortfall so nothing is counted twice. */
function bankReps(lv){
  lv.ex.forEach(function(e,i){
    if(e.mode==='reps'){
      const short=e.reps*e.sets-(W.tapped[i]||0);
      if(short>0){ S.totalReps+=short; S.repsToday+=short; }
    } else {
      S.totalWorkoutSec+=e.hold*e.sets;
    }
  });
  refreshDay(); save();
}
function finishLevel(){
  const lv=W.level;
  const key=String(lv.n);
  const first=!S.history[key];
  if(first){
    bankReps(lv);
    S.history[key]=new Date().toISOString().slice(0,10);
    S.xp+=lv.xp;
    S.workoutsDone++;
    const t=new Date().toISOString().slice(0,10);
    if(S.lastDone!==t){ S.lastDone=t; S.streak=(S.lastDone===yesterday())?S.streak+1:1; }
    S.bestStreak=Math.max(S.bestStreak,S.streak);
    const lvNew=levelOf(S.xp);
    if(lvNew>S.level){ S.level=lvNew; }
  }
  save(); confetti(); stopTimer();
  if(typeof cloudPush === 'function') cloudPush();
  W.level=null; W.phase='idle';
  VIEW='dash'; render();
  if(first && S.level>lv.n) setTimeout(()=>toast('LEVEL UP — '+S.level),600);
  else setTimeout(()=>toast('Level '+lv.n+' logged'),600);
}
function yesterday(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function confetti(){
  const box=$('#conf'), cols=['#ff6b3d','#3d8bff','#2fd6a0','#a06bff','#ffc857','#fff'];
  for(let i=0;i<34;i++){
    const el=document.createElement('i');
    el.style.left=Math.random()*100+'vw'; el.style.top='-20px';
    el.style.background=cols[i%cols.length];
    el.style.animationDelay=(Math.random()*.35)+'s';
    el.style.animationDuration=(1.1+Math.random()*.9)+'s';
    box.appendChild(el);
    (function(e){ setTimeout(()=>e.remove(),2600); })(el);
  }
}
let toastT=null;
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:99;background:#1c2540;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 12px 30px -12px #000;max-width:90vw;text-align:center';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; },1900);
}

function CLIMATENOTE(){
  const m=new Date().getMonth()+1;
  if(m>=3&&m<=6) return CLIMATE['Mar–Jun (hot, 36–42°C)'];
  if(m>=7&&m<=9) return CLIMATE['Jul–Sep (monsoon)'];
  if(m>=10&&m<=12) return CLIMATE['Oct–Feb (cool, dry)'];
  return CLIMATE['Jan–Feb (cool, dry)']||CLIMATE['Oct–Feb (cool, dry)'];
}

/* ==========================================================================
   8. RENDER + EVENTS
   ========================================================================== */
const VIEWS={dash:viewDash, work:viewWork, levels:viewLevels, diet:viewDiet, me:viewMe};
function render(){
  setTrackVar();
  const v=$('#view'); v.innerHTML=VIEWS[VIEW]();
  $('#xpLbl').innerHTML='LV <b>'+S.level+'</b> · <b>'+nf(S.xp)+'</b> XP';
  $('#rail').style.width=Math.max(0.4,(S.level/10))+'%';
  $$('nav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===VIEW); });
  if(VIEW==='work'&&W.level&&W.timer) paintTimer();
  const r=$('#roadRange');
  if(r) r.addEventListener('input',function(){ ROAD_FROM=+this.value; $('#roadEnd').textContent='Level '+Math.min(1000,ROAD_FROM+9); $('#roadList').innerHTML=roadList(ROAD_FROM); });
}
function go(v){ VIEW=v; stopTimer(); W.paused=false; render(); window.scrollTo(0,0); }

document.addEventListener('click',function(ev){
  const nav=ev.target.closest('nav button');
  if(nav){ go(nav.dataset.v); return; }
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='start'||a==='peek'){ const n=+el.dataset.n; if(!isUnlocked(n)){ toast('🔒 Level '+n+' is locked. Finish level '+(n-1)+' first.'); return; } startLevel(n); }
  else if(a==='go'){ W.started=true; beginWork(); render(); }
  else if(a==='pause'){ pauseTimer(); render(); }
  else if(a==='skip'){ skipPhase(); render(); }
  else if(a==='reps'){ manualRep(+el.dataset.n); }
  else if(a==='finish'){ finishLevel(); }
  else if(a==='quit'){ W.level=null; W.phase='idle'; stopTimer(); VIEW='levels'; render(); }
  else if(a==='track'){ trackPicker(); }
  else if(a==='savebody'){ S.bw=($('#bw')||{}).value||''; S.height=($('#ht')||{}).value||''; save(); toast('Saved'); render(); }
  else if(a==='export'){ exportData(); }
  else if(a==='import'){ importData(); }
  else if(a==='g-signin'){ googleSignIn(); }
  else if(a==='em-signin'){ emailSignInModal(); }
  else if(a==='g-signout'){ googleSignOut(); }
  else if(a==='cloud-push'){ cloudPush(); toast('Backing up to cloud...'); }
  else if(a==='cloud-pull'){ cloudPull(); toast('Restoring from cloud...'); }
  else if(a==='fb-config'){ showFirebaseConfigModal(); }
  else if(a==='reset'){ if(confirm('Erase all progress? This cannot be undone.')){ localStorage.removeItem(KEY); S=blank; VIEW='dash'; render(); } }
});
function trackPicker(){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML='<div class="in"><h2>Which goal are you training for?</h2>'
   +'<p class="mut">This changes your rank colour, your fuel note, and which levels feel hardest. You can switch any time — the 1,000-level ladder is the same either way.</p>'
   +TRACK_ORDER.map(function(k){ const t=TRACKS[k];
     return '<div class="lv'+(S.track===k?' cur':'')+'" data-k="'+k+'" style="cursor:pointer">'
       +'<div class="n" style="font-size:19px">'+t.icon+'</div>'
       +'<div class="grow"><div class="t1">'+t.name+'</div><div class="t2">'+esc(t.goal)+'</div>'
       +'<div class="t2" style="color:'+t.color+'">'+esc(t.dial)+'</div></div></div>'; }).join('')
   +'<button class="btn ghost" data-close="1" style="margin-top:10px">Close</button></div>';
  document.body.appendChild(m);
  m.addEventListener('click',function(ev){
    const c=ev.target.closest('[data-close]'); if(c){ m.remove(); return; }
    const p=ev.target.closest('[data-k]');
    if(p){ S.track=p.dataset.k; S.onboarded=true; save(); m.remove(); setTrackVar(); render(); toast('Track: '+TRACKS[S.track].name); }
  });
}
function exportData(){
  const txt=JSON.stringify(S, null, 2);
  const blob=new Blob([txt], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='health-level-1000-backup-'+(new Date().toISOString().slice(0,10))+'.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 500);
  toast('Backup file downloaded');
}
function importData(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='.json,application/json';
  input.onchange=function(e){
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=function(evt){
      try{
        const o=JSON.parse(evt.target.result);
        if(!o || typeof o!=='object') throw new Error('Invalid format');
        S=Object.assign({}, blank, o);
        save();
        setTrackVar();
        VIEW='dash';
        render();
        toast('Backup restored successfully!');
      }catch(err){
        toast('Invalid backup file');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

let fbUser = null, fbAuth = null, fbDb = null, syncStatus = 'idle', lastSyncTime = null;

const DEFAULT_FB_CONFIG = {
  apiKey: "AIzaSyA-oBvOr0Bml-kfnIztTMwdHyT8FnE1wPw",
  authDomain: "health-level-1000-89c14.firebaseapp.com",

function getFbConfig(){
  try {
    const custom = JSON.parse(localStorage.getItem('hl1000.fbConfig'));
    if(custom && custom.apiKey && custom.projectId) return custom;
  } catch(e){}
  return DEFAULT_FB_CONFIG;
}

function initFirebase(){
  if(typeof firebase === 'undefined') return;
  const cfg = getFbConfig();
  if(!cfg) return;
  try {
    if(!firebase.apps.length){
      firebase.initializeApp(cfg);
    }
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();

    // Handle redirect result (vital for mobile APK / WebView login)
    fbAuth.getRedirectResult().then(function(res){
      if(res && res.user){
        fbUser = res.user;
        toast('Welcome back, ' + (fbUser.displayName || fbUser.email));
        cloudPull();
        render();
      }
    }).catch(function(err){
      console.error('Redirect result error:', err);
      if(err && err.message && err.code !== 'auth/null-user') {
        toast('Auth: ' + err.message);
      }
    });

    fbAuth.onAuthStateChanged(function(u){
      fbUser = u;
      if(u){
        syncStatus = 'synced';
        cloudPull();
      } else {
        syncStatus = 'idle';
      }
      render();
    });
  } catch(err){
    console.error('Firebase init error:', err);
    syncStatus = 'error';
  }
}

function isNativeApp(){
  return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())
      || (location.protocol === 'capacitor:' || location.protocol === 'ionic:' || location.hostname === 'localhost');
}

function googleSignIn(){
  if(typeof firebase === 'undefined'){
    toast('Connecting to Firebase...');
    setTimeout(googleSignIn, 800);
    return;
  }
  const cfg = getFbConfig();
  if(!cfg){
    showFirebaseConfigModal();
    return;
  }
  if(!fbAuth){
    initFirebase();
  }
  if(!fbAuth){
    toast('Initializing login engine...');
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');
  syncStatus = 'syncing';
  render();

  if(isNativeApp()){
    fbAuth.signInWithRedirect(provider).catch(function(err){
      console.error('Native redirect error:', err);
      fbAuth.signInWithPopup(provider).then(function(res){
        fbUser = res.user;
        toast('Welcome, ' + (fbUser.displayName || fbUser.email));
        cloudPull();
      }).catch(function(e2){
        toast('Google sign-in: ' + (e2.message || err.message));
        syncStatus = 'error';
        render();
      });
    });
  } else {
    fbAuth.signInWithPopup(provider).then(function(res){
      fbUser = res.user;
      toast('Welcome, ' + (fbUser.displayName || fbUser.email));
      cloudPull();
    }).catch(function(err){
      console.error('Sign in popup error:', err);
      if(err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user'){
        fbAuth.signInWithRedirect(provider).catch(function(e2){
          toast('Login: ' + e2.message);
          syncStatus = 'error';
          render();
        });
      } else {
        toast('Login: ' + err.message);
        syncStatus = 'error';
        render();
      }
    });
  }
}

function googleSignOut(){
  if(fbAuth){
    fbAuth.signOut().then(function(){
      fbUser = null;
      syncStatus = 'idle';
      toast('Signed out from Google');
      render();
    });
  }
}

function cloudPush(){
  if(!fbUser || !fbDb) return;
  syncStatus = 'syncing';
  render();
  const payload = Object.assign({}, S, {
    clientUpdatedAt: new Date().toISOString()
  });
  fbDb.collection('users').doc(fbUser.uid).set(payload, { merge: true }).then(function(){
    syncStatus = 'synced';
    lastSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    render();
  }).catch(function(err){
    console.error('Cloud push failed:', err);
    syncStatus = 'error';
    render();
  });
}

function cloudPull(){
  if(!fbUser || !fbDb) return;
  syncStatus = 'syncing';
  render();
  fbDb.collection('users').doc(fbUser.uid).get().then(function(doc){
    if(doc.exists){
      const remote = doc.data();
      if(remote.level > S.level || (remote.xp > S.xp && remote.level >= S.level)){
        S = Object.assign({}, S, remote);
        save();
        setTrackVar();
        toast('Cloud state restored! Level ' + S.level);
      } else {
        cloudPush();
      }
    } else {
      cloudPush();
    }
    syncStatus = 'synced';
    lastSyncTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    render();
  }).catch(function(err){
    console.error('Cloud pull failed:', err);
    syncStatus = 'error';
    render();
  });
}

/* ---------- PWA: offline shell + install shortcuts + persistence ---------- */
/* Only registers on https/http. file:// has no SW support, and the app still
   works there (everything is in this one file). */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().then(function(persistent){
        if(!persistent) console.log('Storage not marked as persistent');
      });
    }
  });
}
window.addEventListener('hashchange',function(){
  const h=location.hash.replace('#','');

});
if(location.hash){
